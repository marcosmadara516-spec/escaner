<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Etiquetas de precio CCN y CDN</title>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" defer></script>
<style id="estiloPagina"></style>
<style>
  :root { --azul:#0d47a1; --azul2:#1565c0; --gris:#f2f4f7; --borde:#d8dde5; --texto:#1b1f24; --verde:#2e7d32; --rojo:#c62828; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--gris); color:var(--texto); padding-bottom:150px; }
  header { background:var(--azul); color:#fff; padding:14px 16px; position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:10px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  header a { color:#fff; font-size:13px; opacity:.85; }
  main { max-width:640px; margin:0 auto; padding:12px; }
  .tarjeta { background:#fff; border:1px solid var(--borde); border-radius:12px; padding:12px; margin-bottom:12px; }
  .camara { position:relative; background:#000; border-radius:10px; overflow:hidden; aspect-ratio:4/3; display:none; }
  .camara.on { display:block; }
  .camara video { width:100%; height:100%; object-fit:cover; }
  .camara .mira { position:absolute; left:10%; right:10%; top:38%; height:24%; border:3px solid #4fc3f7; border-radius:8px; box-shadow:0 0 0 9999px rgba(0,0,0,.35); }
  .fila { display:flex; gap:8px; align-items:center; }
  button { font:inherit; border:0; border-radius:10px; padding:11px 14px; cursor:pointer; background:var(--azul2); color:#fff; font-weight:600; }
  button.sec { background:#e3e8ef; color:var(--texto); }
  button.peligro { background:#fdecea; color:var(--rojo); }
  button:disabled { opacity:.5; }
  input, select { font:inherit; padding:10px; border:1px solid var(--borde); border-radius:10px; width:100%; background:#fff; }
  .grande { width:100%; padding:14px; font-size:17px; }
  .estado { font-size:13px; color:#5b6573; margin-top:8px; min-height:18px; }
  .item { display:grid; grid-template-columns:1fr auto; gap:10px; border-top:1px solid var(--borde); padding:12px 0; }
  .item:first-child { border-top:0; }
  .item .nom { font-weight:700; font-size:15px; }
  .item .cod { font-size:12px; color:#5b6573; font-family:ui-monospace,monospace; }
  .item .controles { display:flex; gap:8px; margin-top:8px; align-items:center; flex-wrap:wrap; }
  .precio { width:120px; }
  .precio input { font-weight:700; }
  .copias { display:flex; align-items:center; border:1px solid var(--borde); border-radius:10px; overflow:hidden; }
  .copias button { background:#fff; color:var(--texto); border-radius:0; padding:8px 12px; font-size:18px; }
  .copias span { min-width:30px; text-align:center; font-weight:700; }
  .guardado { font-size:12px; color:var(--verde); }
  .error { color:var(--rojo); }
  .vista { width:60mm; height:30mm; transform:scale(.55); transform-origin:top right; margin-left:-27mm; margin-bottom:-13.5mm; box-shadow:0 0 0 1px #bbb; }
  .vacio { text-align:center; color:#5b6573; padding:20px 8px; }
  .pie { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--borde); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); z-index:5; }
  .pie .in { max-width:640px; margin:0 auto; display:grid; gap:8px; }
  .pie .botones { display:grid; grid-template-columns:2fr 1fr 1fr; gap:8px; }
  .aviso { position:fixed; left:50%; bottom:130px; transform:translateX(-50%); background:#263238; color:#fff; padding:10px 16px; border-radius:20px; font-size:14px; z-index:20; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90vw; text-align:center; }
  .aviso.ver { opacity:1; }
  .version { text-align:center; font-size:12px; color:#8a94a3; margin:16px 0; }

  /* ===== Etiqueta 60 × 30 mm ===== */
  .etq { width:60mm; height:30mm; background:#fff; color:#000; padding:1.3mm 2mm 1mm; display:flex; flex-direction:column; overflow:hidden; font-family:Arial,Helvetica,sans-serif; }
  .etq .e-nom { font-size:2.75mm; line-height:1.15; font-weight:700; text-transform:uppercase; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; height:6.35mm; }
  .etq .e-precio { font-size:7.2mm; line-height:1; font-weight:900; text-align:center; margin:.6mm 0 .5mm; white-space:nowrap; }
  .etq .e-precio small { font-size:4mm; font-weight:700; }
  .etq .e-bar { flex:1; min-height:0; display:flex; justify-content:center; }
  .etq .e-bar svg { height:100%; width:auto; max-width:100%; }
  .etq .e-num { font-size:2.5mm; line-height:1; text-align:center; letter-spacing:.35mm; font-family:"Courier New",monospace; margin-top:.4mm; }

  #impresion { display:none; }
  .hoja-carta { display:grid; grid-template-columns:repeat(3,60mm); grid-auto-rows:30mm; column-gap:2mm; row-gap:1mm; }
  .hoja-carta .etq { outline:0.2mm dashed #bbb; }
  @media print {
    body { background:#fff; padding:0; }
    header, main, .pie, .aviso { display:none !important; }
    #impresion { display:block; }
    .etq { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .salto { break-after:page; page-break-after:always; }
  }
</style>
</head>
<body>
<header>
  <h1>🏷️ Etiquetas de precio</h1>
  <a href="index.html">← Escáner</a>
</header>

<main>
  <div class="tarjeta">
    <div class="camara" id="camara">
      <video id="video" playsinline muted></video>
      <div class="mira"></div>
    </div>
    <button class="grande" id="btnCamara">📷 Escanear productos</button>
    <div class="fila" style="margin-top:10px">
      <input id="codManual" inputmode="numeric" placeholder="O escribe el código de barras" autocomplete="off">
      <button id="btnAgregar">Agregar</button>
    </div>
    <div class="estado" id="estado">Cargando catálogo…</div>
  </div>

  <div class="tarjeta">
    <div class="fila" style="justify-content:space-between;margin-bottom:4px">
      <strong id="tituloLista">Productos (0)</strong>
      <button class="peligro" id="btnVaciar" style="padding:7px 12px">Vaciar</button>
    </div>
    <div id="lista"></div>
  </div>

  <div class="version">Etiquetas CCN y CDN · Versión 1</div>
</main>

<div class="pie">
  <div class="in">
    <select id="formato">
      <option value="termica">Térmica · rollo de 60 × 30 mm</option>
      <option value="carta">Hoja carta · 24 por hoja</option>
    </select>
    <div class="botones">
      <button id="btnImprimir">🖨️ Imprimir (0)</button>
      <button class="sec" id="btnPdf">PDF</button>
      <button class="sec" id="btnCompartir">Enviar</button>
    </div>
  </div>
</div>

<div id="impresion"></div>
<div class="aviso" id="aviso"></div>

<script>
/* ======= CONFIGURACIÓN (igual que en index.html del escáner) ======= */
const API_URL = 'https://script.google.com/macros/s/AKfycbyvpcO6c2K2YQvtzC4Y1XidDCzytRMKU7S2ncWdgua-Y20VpWARAnuvpCAqmofXtzfO/exec';
const CLAVE   = 'CCN';
/* =================================================================== */

const $ = id => document.getElementById(id);
const CLAVE_LISTA = 'etiquetas_lista_v1';
const CLAVE_CATALOGO = 'etiquetas_catalogo_v1';
const CLAVE_FORMATO = 'etiquetas_formato_v1';

let catalogo = {};          // código -> {c, cat, p, pres, precio}
let lista = [];             // [{c, copias, nombre, precio}]
let flujo = null, detector = null, lectorZx = null, timerScan = null;
let ultimo = { c: '', t: 0 };

/* ---------- utilidades ---------- */
function guardarLocal(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function leerLocal(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m])); }
function norm(c) { c = String(c || '').trim().replace(/\s+/g, ''); if (/^\d{12}$/.test(c)) c = '0' + c; return c; }
function aviso(t) { const a = $('aviso'); a.textContent = t; a.classList.add('ver'); clearTimeout(aviso.t); aviso.t = setTimeout(() => a.classList.remove('ver'), 1800); }
function dinero(n) {
  const v = Number(n);
  if (n === '' || n == null || isNaN(v)) return '';
  return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function nombreDe(it) {
  if (it.nombre) return it.nombre;
  const k = catalogo[it.c];
  if (!k) return '';
  return (k.pres || k.p || '').toUpperCase();
}
function precioDe(it) { return it.precio != null && it.precio !== '' ? it.precio : (catalogo[it.c] ? catalogo[it.c].precio : null); }

async function api(datos) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...datos, clave: CLAVE }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Error del servidor');
  return j;
}

/* ---------- código de barras ---------- */
function digitoEAN(s) { let t = 0; for (let i = 0; i < s.length; i++) t += (+s[i]) * ((s.length - i) % 2 ? 3 : 1); return (10 - t % 10) % 10; }
function formatoBarra(c) {
  if (/^\d{13}$/.test(c) && digitoEAN(c.slice(0, 12)) == c[12]) return 'EAN13';
  if (/^\d{8}$/.test(c) && digitoEAN(c.slice(0, 7)) == c[7]) return 'EAN8';
  return 'CODE128';
}
function dibujarBarra(destino, c) {
  const op = { format: formatoBarra(c), displayValue: false, margin: 0, width: 2, height: 60, flat: true };
  try { JsBarcode(destino, c, op); } catch (e) { op.format = 'CODE128'; JsBarcode(destino, c, op); }
  if (destino.tagName.toLowerCase() === 'svg') {
    const w = parseFloat(destino.getAttribute('width')), h = parseFloat(destino.getAttribute('height'));
    destino.setAttribute('viewBox', `0 0 ${w} ${h}`);
    destino.setAttribute('preserveAspectRatio', 'none');
    destino.removeAttribute('width'); destino.removeAttribute('height');
    destino.style.removeProperty('transform');
    destino.dataset.ancho = w; destino.dataset.alto = h;
  }
}
function crearEtiqueta(it) {
  const div = document.createElement('div');
  div.className = 'etq';
  const p = precioDe(it);
  div.innerHTML = `<div class="e-nom">${esc(nombreDe(it) || it.c)}</div>
    <div class="e-precio">${p != null && p !== '' ? '<small>C$</small> ' + dinero(p) : '&nbsp;'}</div>
    <div class="e-bar"><svg></svg></div>
    <div class="e-num">${esc(it.c)}</div>`;
  const svg = div.querySelector('svg');
  dibujarBarra(svg, it.c);
  // ancho del código: proporcional, máx. todo el ancho útil (56 mm)
  const mm = Math.min(56, (parseFloat(svg.dataset.ancho) / 2) * 0.33 * 1.05);
  svg.style.width = Math.max(mm, 30) + 'mm';
  return div;
}

/* ---------- catálogo ---------- */
async function cargarCatalogo() {
  const cache = leerLocal(CLAVE_CATALOGO, null);
  if (cache) { catalogo = cache; pintar(); }
  try {
    const r = await api({ accion: 'etq_data' });
    catalogo = {};
    r.items.forEach(x => { catalogo[norm(x.c)] = x; });
    guardarLocal(CLAVE_CATALOGO, catalogo);
    $('estado').textContent = `Catálogo listo: ${r.items.length} códigos.`;
    pintar();
  } catch (e) {
    $('estado').innerHTML = `<span class="error">No se pudo cargar el catálogo (${esc(e.message)}).</span>` + (cache ? ' Usando la copia guardada.' : '');
  }
}

/* ---------- lista ---------- */
function agregar(codigo) {
  const c = norm(codigo);
  if (!c) return;
  const ya = lista.find(x => x.c === c);
  if (ya) { ya.copias++; aviso(`${nombreDe(ya) || c} · ${ya.copias} copias`); }
  else {
    lista.unshift({ c, copias: 1, nombre: '', precio: null });
    const k = catalogo[c];
    aviso(k ? (nombreDe({ c }) || c) : `Código nuevo ${c}: escribe el nombre`);
  }
  guardarLocal(CLAVE_LISTA, lista);
  pintar();
}

function pintar() {
  const cont = $('lista');
  const total = lista.reduce((s, x) => s + x.copias, 0);
  $('tituloLista').textContent = `Productos (${lista.length})`;
  $('btnImprimir').textContent = `🖨️ Imprimir (${total})`;
  if (!lista.length) { cont.innerHTML = '<div class="vacio">Escanea productos para hacer sus etiquetas.</div>'; return; }
  cont.innerHTML = '';
  lista.forEach((it, i) => {
    const conocido = !!catalogo[it.c] && !!(catalogo[it.c].p || catalogo[it.c].pres);
    const p = precioDe(it);
    const fila = document.createElement('div');
    fila.className = 'item';
    fila.innerHTML = `
      <div>
        ${conocido && !it.editNombre
          ? `<div class="nom">${esc(nombreDe(it))}</div>`
          : `<input class="inNombre" placeholder="Nombre del producto" value="${esc(nombreDe(it))}">`}
        <div class="cod">${esc(it.c)}${catalogo[it.c] && catalogo[it.c].cat ? ' · ' + esc(catalogo[it.c].cat) : ''}</div>
        <div class="controles">
          <div class="precio"><input class="inPrecio" type="number" inputmode="decimal" step="0.01" min="0" placeholder="C$ precio" value="${p != null ? p : ''}"></div>
          <div class="copias"><button class="menos">−</button><span>${it.copias}</span><button class="mas">+</button></div>
          <button class="peligro quitar" style="padding:8px 12px">✕</button>
          <span class="guardado"></span>
        </div>
      </div>
      <div class="vista-cont"></div>`;
    const vista = crearEtiqueta(it); vista.classList.add('vista');
    fila.querySelector('.vista-cont').appendChild(vista);

    fila.querySelector('.menos').onclick = () => { if (it.copias > 1) { it.copias--; guardarLocal(CLAVE_LISTA, lista); pintar(); } };
    fila.querySelector('.mas').onclick = () => { it.copias++; guardarLocal(CLAVE_LISTA, lista); pintar(); };
    fila.querySelector('.quitar').onclick = () => { lista.splice(i, 1); guardarLocal(CLAVE_LISTA, lista); pintar(); };
    const inN = fila.querySelector('.inNombre');
    if (inN) inN.onchange = () => { it.nombre = inN.value.trim().toUpperCase(); guardarLocal(CLAVE_LISTA, lista); guardarPrecio(it, fila); };
    const inP = fila.querySelector('.inPrecio');
    inP.onchange = () => { it.precio = inP.value === '' ? null : Number(inP.value); guardarLocal(CLAVE_LISTA, lista); guardarPrecio(it, fila); };
    cont.appendChild(fila);
  });
}

async function guardarPrecio(it, fila) {
  const p = precioDe(it);
  const marca = fila.querySelector('.guardado');
  if (p == null || p === '' || isNaN(p)) { pintarUno(); return; }
  marca.textContent = 'Guardando…'; marca.classList.remove('error');
  try {
    await api({ accion: 'etq_precio', codigo: it.c, precio: p, producto: it.nombre || '' });
    if (!catalogo[it.c]) catalogo[it.c] = { c: it.c, cat: '', p: '', pres: it.nombre || '', precio: null };
    catalogo[it.c].precio = Number(p);
    if (it.nombre && !catalogo[it.c].p) catalogo[it.c].pres = it.nombre;
    guardarLocal(CLAVE_CATALOGO, catalogo);
    marca.textContent = '✓ Guardado';
  } catch (e) {
    marca.textContent = 'No se guardó: ' + e.message; marca.classList.add('error');
  }
  pintarUno();
}
function pintarUno() { // actualiza vistas previas sin perder el foco
  const filas = $('lista').querySelectorAll('.item');
  filas.forEach((f, i) => { const it = lista[i]; if (!it) return; const c = f.querySelector('.vista-cont'); c.innerHTML = ''; const v = crearEtiqueta(it); v.classList.add('vista'); c.appendChild(v); });
}

/* ---------- validación antes de imprimir ---------- */
function etiquetasParaImprimir() {
  const sinPrecio = lista.filter(x => precioDe(x) == null || precioDe(x) === '');
  if (!lista.length) { aviso('No hay productos en la lista'); return null; }
  if (sinPrecio.length && !confirm(`${sinPrecio.length} producto(s) no tienen precio. ¿Imprimir de todos modos?`)) return null;
  const todas = [];
  lista.slice().reverse().forEach(it => { for (let k = 0; k < it.copias; k++) todas.push(it); });
  return todas;
}

/* ---------- imprimir ---------- */
function imprimir() {
  const todas = etiquetasParaImprimir(); if (!todas) return;
  const formato = $('formato').value;
  const zona = $('impresion'); zona.innerHTML = '';
  if (formato === 'termica') {
    $('estiloPagina').textContent = '@page { size: 60mm 30mm; margin: 0; }';
    todas.forEach((it, i) => { const e = crearEtiqueta(it); if (i < todas.length - 1) e.classList.add('salto'); zona.appendChild(e); });
  } else {
    $('estiloPagina').textContent = '@page { size: letter; margin: 0; } #impresion .hoja-carta { padding: 16mm 0 0 16mm; }';
    for (let i = 0; i < todas.length; i += 24) {
      const hoja = document.createElement('div'); hoja.className = 'hoja-carta';
      if (i + 24 < todas.length) hoja.classList.add('salto');
      todas.slice(i, i + 24).forEach(it => hoja.appendChild(crearEtiqueta(it)));
      zona.appendChild(hoja);
    }
  }
  setTimeout(() => window.print(), 150);
}

/* ---------- PDF ---------- */
function hacerPdf() {
  const todas = etiquetasParaImprimir(); if (!todas) return null;
  if (!window.jspdf) { aviso('El generador de PDF aún no carga, intenta de nuevo'); return null; }
  const { jsPDF } = window.jspdf;
  const termica = $('formato').value === 'termica';
  const doc = termica ? new jsPDF({ orientation: 'landscape', unit: 'mm', format: [60, 30], compress: true })
                      : new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter', compress: true });
  const lienzo = document.createElement('canvas');
  todas.forEach((it, i) => {
    let x = 0, y = 0;
    if (termica) { if (i) doc.addPage([60, 30], 'landscape'); }
    else {
      const pos = i % 24; if (i && !pos) doc.addPage('letter', 'portrait');
      x = 16 + (pos % 3) * 62; y = 16 + Math.floor(pos / 3) * 31;
      doc.setDrawColor(190); doc.setLineDashPattern([1, 1], 0); doc.setLineWidth(0.2); doc.rect(x, y, 60, 30); doc.setLineDashPattern([], 0);
    }
    // nombre (2 líneas máx.)
    doc.setFont('helvetica', 'bold'); doc.setFontSize(7.8); doc.setTextColor(0);
    let lineas = doc.splitTextToSize(nombreDe(it) || it.c, 56);
    if (lineas.length > 2) { lineas = lineas.slice(0, 2); lineas[1] = lineas[1].replace(/.{0,2}$/, '…'); }
    doc.text(lineas, x + 2, y + 3.6, { lineHeightFactor: 1.15 });
    // precio
    const p = precioDe(it);
    if (p != null && p !== '') {
      const num = dinero(p);
      doc.setFontSize(21); const wn = doc.getTextWidth(num);
      doc.setFontSize(11.5); const wc = doc.getTextWidth('C$ ');
      const x0 = x + 30 - (wn + wc) / 2;
      doc.text('C$ ', x0, y + 14.4);
      doc.setFontSize(21); doc.text(num, x0 + wc, y + 14.4);
    }
    // código de barras
    const op = { format: formatoBarra(it.c), displayValue: false, margin: 0, width: 4, height: 120, flat: true };
    try { JsBarcode(lienzo, it.c, op); } catch (e) { op.format = 'CODE128'; JsBarcode(lienzo, it.c, op); }
    const anchoMm = Math.max(30, Math.min(56, (lienzo.width / 4) * 0.33 * 1.05));
    doc.addImage(lienzo.toDataURL('image/png'), 'PNG', x + 30 - anchoMm / 2, y + 16.2, anchoMm, 10.2);
    doc.setFont('courier', 'normal'); doc.setFontSize(7);
    doc.text(it.c.split('').join(' '), x + 30, y + 29, { align: 'center' });
  });
  return doc;
}
function nombrePdf() { const d = new Date(); return `Etiquetas_${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}.pdf`; }
function descargarPdf() { const doc = hacerPdf(); if (doc) doc.save(nombrePdf()); }
async function compartirPdf() {
  const doc = hacerPdf(); if (!doc) return;
  const archivo = new File([doc.output('blob')], nombrePdf(), { type: 'application/pdf' });
  if (navigator.canShare && navigator.canShare({ files: [archivo] })) {
    try { await navigator.share({ files: [archivo], title: 'Etiquetas de precio' }); } catch (e) {}
  } else { doc.save(nombrePdf()); aviso('Este teléfono no permite compartir; se descargó el PDF'); }
}

/* ---------- escáner en vivo ---------- */
function pitido() {
  try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  try {
    const ctx = pitido.ctx || (pitido.ctx = new (window.AudioContext || window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = 1500; g.gain.value = 0.15; o.connect(g); g.connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime + 0.09);
  } catch (e) {}
}
function leido(texto) {
  const c = norm(texto); const ahora = Date.now();
  if (!c || (c === ultimo.c && ahora - ultimo.t < 1800)) return;
  ultimo = { c, t: ahora };
  pitido(); agregar(c);
}
async function abrirCamara() {
  if (flujo || lectorZx) { cerrarCamara(); return; }
  $('camara').classList.add('on'); $('btnCamara').textContent = '⏹️ Terminar de escanear';
  const video = $('video');
  try {
    if ('BarcodeDetector' in window) {
      const soportados = await BarcodeDetector.getSupportedFormats();
      const quiero = ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','itf'].filter(f => soportados.includes(f));
      if (quiero.length) detector = new BarcodeDetector({ formats: quiero });
    }
    if (detector) {
      flujo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } }, audio: false });
      video.srcObject = flujo; await video.play();
      const ciclo = async () => {
        if (!flujo) return;
        try { const r = await detector.detect(video); if (r.length) leido(r[0].rawValue); } catch (e) {}
        timerScan = setTimeout(ciclo, 180);
      };
      ciclo();
    } else {
      if (!window.ZXing) { aviso('Cargando lector…'); await new Promise(r => setTimeout(r, 1200)); }
      lectorZx = new ZXing.BrowserMultiFormatReader();
      await lectorZx.decodeFromConstraints({ video: { facingMode: { ideal: 'environment' } } }, video, (res) => { if (res) leido(res.getText()); });
    }
    $('estado').textContent = 'Apunta al código. Cada lectura suma una etiqueta.';
  } catch (e) {
    cerrarCamara();
    $('estado').innerHTML = `<span class="error">No se pudo abrir la cámara: ${esc(e.message)}</span>`;
  }
}
function cerrarCamara() {
  clearTimeout(timerScan);
  if (flujo) { flujo.getTracks().forEach(t => t.stop()); flujo = null; }
  if (lectorZx) { try { lectorZx.reset(); } catch (e) {} lectorZx = null; }
  detector = null;
  $('video').srcObject = null;
  $('camara').classList.remove('on'); $('btnCamara').textContent = '📷 Escanear productos';
}

/* ---------- inicio ---------- */
$('btnCamara').onclick = abrirCamara;
$('btnAgregar').onclick = () => { const v = $('codManual').value; if (v.trim()) { agregar(v); $('codManual').value = ''; } };
$('codManual').addEventListener('keydown', e => { if (e.key === 'Enter') $('btnAgregar').click(); });
$('btnVaciar').onclick = () => { if (lista.length && confirm('¿Quitar todos los productos de la lista?')) { lista = []; guardarLocal(CLAVE_LISTA, lista); pintar(); } };
$('btnImprimir').onclick = imprimir;
$('btnPdf').onclick = descargarPdf;
$('btnCompartir').onclick = compartirPdf;
$('formato').value = leerLocal(CLAVE_FORMATO, 'termica');
$('formato').onchange = () => guardarLocal(CLAVE_FORMATO, $('formato').value);

lista = leerLocal(CLAVE_LISTA, []);
pintar();
cargarCatalogo();
</script>
